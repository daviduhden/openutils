name: OpenUtils Tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Log timing and peak memory for representative workloads'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: openutils-tests-${{ github.run_id }}
  cancel-in-progress: true

jobs:

  linux:
    runs-on: ubuntu-24.04
    # The container supplies the C23 toolchains and libc independently of
    # the host runner image. The matrix applies both compilers to both checks.
    container: ubuntu:26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates clang gcc git libc6-dev make pkg-config libncurses-dev libio-pty-perl locales time libclang-rt-dev
          locale-gen en_US.UTF-8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and run regression suites
        env:
          TEST_CC: ${{ matrix.compiler }}
          LC_ALL: en_US.UTF-8
        run: |
          cat /etc/os-release
          dpkg-query -W clang gcc libc6-dev make libncurses-dev libio-pty-perl
          "$TEST_CC" --version
          make check CC="$TEST_CC" CHECK_CC="$TEST_CC"
          make test CC="$TEST_CC"
      # Seed the staging root with a neighboring dictionary to check ownership
      # boundaries for both install and uninstall.
      - name: Verify staged dictionary installation
        env:
          TEST_CC: ${{ matrix.compiler }}
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/opt/openutils/share/myspell"
          printf '%s\n' third-party > "$work/opt/openutils/share/myspell/en_US.dic"
          make -C ee CC="$TEST_CC" CPPFLAGS=-DOPENUTILS_CI=1 PREFIX=/opt/openutils DESTDIR="$work" install
          cmp ee/spell/en_US.dic "$work/opt/openutils/share/openutils/ee/en_US.dic"
          make -C ee PREFIX=/opt/openutils DESTDIR="$work" uninstall
          test ! -e "$work/opt/openutils/share/openutils/ee/en_US.dic"
          test "$(cat "$work/opt/openutils/share/myspell/en_US.dic")" = third-party
      - name: Check noninteractive utilities with sanitizers
        if: inputs.profile && matrix.compiler == 'clang'
        env:
          LC_ALL: en_US.UTF-8
        run: |
          set -eu
          make -C tree clean
          make -C truncate clean
          make -C tree test CFLAGS="-O1 -g -fsanitize=address,undefined"
          make -C truncate test CFLAGS="-O1 -g -fsanitize=address,undefined"
      # This step follows the sanitizer run in the same job. A clean tree
      # build restores ordinary compiler flags before collecting timings.
      - name: Measure wide trees and large editor inputs
        if: inputs.profile && matrix.compiler == 'clang'
        env:
          LC_ALL: en_US.UTF-8
          TERM: xterm
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/wide" "$work/home"
          export HOME="$work/home"
          i=0
          while [ "$i" -lt 512 ]; do
            mkdir "$work/wide/d$i"
            ln -s "d$i" "$work/wide/z$i"
            i=$((i + 1))
          done
          make -C tree clean
          make -C tree
          make -C ee
          perl -e 'print((("word " x 15 . "\n") x 65536), ("x" x 65536), "\n")' > "$work/editor.txt"
          for sample in 1 2 3; do
            echo "Profile sample $sample"
            /usr/bin/time -v ./tree/tree -i -J -l "$work/wide" > "$work/tree.json"
            /usr/bin/time -v ./tree/tree -i -J --filelimit 32 "$work/wide" > "$work/limited.json"
            /usr/bin/time -v perl ee/tests/pty_run.pm "$PWD/ee/ee" -i "$work/editor.txt" -- '\x11' > "$work/editor.log"
          done

  openbsd:
    # The guest exercises native libc and pledge. The Linux job exercises
    # the build with compatibility shims where its libc needs them.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and test with OpenBSD libc and pledge
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          release: '8.0'
          prepare: pkg_add ncurses p5-IO-Tty
          run: |
            set -eu
            uname -a
            clang --version
            pkg_info -a
            make check
            make test
