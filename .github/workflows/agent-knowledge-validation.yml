name: Agent Knowledge Validation

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base Git ref for validating the committed range'
        required: true
        default: origin/main
        type: string

permissions:
  contents: read

concurrency:
  group: agent-knowledge-validation-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate-agent-knowledge:
    name: Agent Knowledge Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range check needs the base ref and its common ancestor with HEAD.
          fetch-depth: 0
          persist-credentials: false
      # Contract tests create their own repositories. The worktree and
      # range checks below inspect this checkout.
      - name: Run canonical contract tests
        run: prove tests/agent_knowledge_validator/test_validator.pl
      - name: Run canonical worktree validation
        run: perl scripts/validate-agent-knowledge.pl --scope worktree
      - name: Validate committed range
        env:
          VALIDATION_BASE: ${{ inputs.base }}
        run: perl scripts/validate-agent-knowledge.pl --scope range --base "$VALIDATION_BASE" --head HEAD
