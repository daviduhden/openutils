name: Agent and skills maintenance

on:
  pull_request:

permissions:
  contents: read

jobs:
  synchronization:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate agent and skills synchronization
        run: perl scripts/check-agent-maintenance.pl --base "origin/${{ github.base_ref }}"
